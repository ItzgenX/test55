# @package _global_
#
# configs/experiment/train_seg.yaml
# ---------------------------------
# SegFormer training experiment. Reuses the ENTIRE segmentation pipeline
# (segformer_training.py, SegJsonDataModule, the struct LoRA + mapper) and swaps only:
#   • the encoder slot     -> identity (skip_encode=True feeds precomputed maps straight to the mapper)
#   • the data module      -> segformer_jsonl (this branch's own 19-class Cityscapes-trainId manifests)
# Everything else (LoRA rank/mode, LR, schedule, grid knobs) is identical to the
# Grounded-SAM config so results stay comparable.
#
# Differences from train_grounded_sam.yaml are flagged inline with "DIFF:".

defaults:
  - /lora@lora.struct: struct
  - override /lora/encoder@lora.struct.encoder: identity           # unused at train time: skip_encode=True bypasses it
  - override /lora/mapper_network@lora.struct.mapper_network: segidXL  # class-ID embedding conditioning, not RGB colorize (2026-08-25)
  - override /model: sdxl
  - override /data: segformer_jsonl                                 # DIFF: SegFormer manifests (was grounded_sam_jsonl)
  - _self_

# =============================================================================
# MODEL LOADING — LOCAL vs INTERNET  (one switch: local_files_only)
# =============================================================================
# The seg encoder model is NOT loaded at train time (training reads pre-saved
# maps via skip_encode=True) -- seg_model_name/seg_model_path below exist for
# the offline map-precompute step (seg_map_calculations.py) and for
# configs/inference_seg.yaml, so training and inference load identical weights.
local_files_only: true

# SDXL, not SD1.5 — SETTLED. The real dataset is natively
# 1280x800; SDXL needs H/W divisible by 32 (satisfied as-is), SD1.5 needs /64
# (NOT satisfied) and would force a distorting resize. Download via:
# python download_models.py
base_model_name:  stabilityai/stable-diffusion-xl-base-1.0
base_model_path:  checkpoints/local_models/stable-diffusion-xl-base-1.0

# DIFF: SegFormer b5, LOCKED -- b5, not b0. Measured mIoU 0.76/0.66 train/val
# against real Cityscapes ground truth in this repo (check_seg_accuracy.py),
# and b5 is the documented highest-accuracy SegFormer variant.
seg_model_name: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
seg_model_path: checkpoints/local_models/segformer-b5-cityscapes

# SDXL's own VAE is numerically unstable in fp16 -- madebyollin/sdxl-vae-fp16-fix
# is REQUIRED, not optional. See model.vae_path below and src/model.py
# ModelBase.__init__. checkpoints/local_models/ is gitignored; this absolute
# path is the shared copy used by both branches, no duplication.
vae_local_path: checkpoints/local_models/sdxl-vae-fp16-fix

# =============================================================================
# HARDWARE — plain, fixed values. Nothing auto-scales at runtime.
# =============================================================================
#   Multi-GPU: accelerate launch --num_processes=N segformer_training.py experiment=train_seg
gradient_checkpointing: true            # ON: verified on the local single 12GB dev GPU. Pure
                                        # recompute-vs-store speed/VRAM tradeoff, mathematically
                                        # IDENTICAL training results either way. On a large
                                        # multi-GPU box (95GB/GPU) it isn't needed -- SDXL's UNet
                                        # is FROZEN, only the ~20M LoRA + ~1.2M mapper params carry
                                        # gradients/optimizer state -- so flip to false there for
                                        # free speed. (batch_size is NOT bumped to match -- that
                                        # changes gradient dynamics, a real decision, not free.)
gradient_accumulation_steps: 1          # 4 batch x 1 accum = 4 effective batch
size: [1280, 800]                       # [width, height] -- the real dataset's NATIVE resolution,
                                        # no resize at all (1280/800 = 1.6). Divisible by 32, which
                                        # is all SDXL needs (VAE/8 x 2 UNet halvings/4) -- unlike
                                        # SD1.5's /64, which is why SD1.5 would have to distort this
                                        # dataset. Enforced by a ValueError guard in
                                        # segformer_training.py: a bad size fails loudly at
                                        # startup, never silently misaligns mid-run.

# --- Resize technique --- #
# "aspect" (only mode supported) = direct resize to the non-square `size`
#   above -- NO pad, NO crop. At 1280x800 on the real dataset this is a no-op.
# MUST match the mode seg_map_calculations.py used to compute your maps.
resize_mode: aspect

# =============================================================================
# 1. GENERAL TRAINING PARAMETERS
# =============================================================================
# Dataset: the Cityscapes stand-in manifests below hold 2975 train / 500 val.
# val_steps/ckpt_steps are STEP counts, so they shift with effective batch --
# recompute them if you change data.batch_size or gradient_accumulation_steps.
# Reality check: a real 150-step run on this exact dataset landed at mIoU~=0.09
# (near-random). The architecture is verified; convergence needs far more steps
# than any local run has done -- see the project decision log's status section.
learning_rate: 1e-4
lr_scheduler: constant
epochs: 10

# DECOUPLED triggers: validate cheaply often, save weights+images less often.
val_steps:  3000
ckpt_steps: 3000

# =============================================================================
# 2. DATA  (DIFF: SegFormer manifests, 19-class Cityscapes-trainId vocabulary)
# =============================================================================
# The class vocabulary lives in code, not config: SEG_CITYSCAPES_PALETTE in
# src/encoders/seg_encoder.py (19 classes, tied to SegFormer-b5's pretrained
# head), read at load time by src/data/local_seg.py. The grounded_sam branch
# keeps its own 28-class CARLA scheme -- the two are deliberately NOT
# interchangeable.
data:
  batch_size:     4
  val_batch_size: 1
  workers:        4
  val_workers:    1
  # DIFF: SegFormer manifests built by seg_map_calculations.py.
  # val_jsonl must be the real val split — NEVER test.
  # Currently a 10/10/10 dev/smoke-test subset (built via
  # `seg_map_calculations.py --data_dir data/dataset --dry_run_n 10`,
  # verified end-to-end calc->train->inference on 2026-08-31). Re-run without
  # --dry_run_n against the full data/dataset/{train,val}.jsonl manifests
  # (4400/500 real entries, seg_path still empty) before a real training run.
  train_jsonl: data/dataset/seg_training_aspect/train.jsonl
  val_jsonl:   data/dataset/seg_training_aspect/val.jsonl

# =============================================================================
# 3. GLOBAL FALLBACK PROMPT
# =============================================================================
prompt: null    # null -> each image uses its own prompt field from the JSONL
                # NOTE: the current stand-in manifests use ONE repeated generic
                # template ("a photo of a city street in X"). Regenerate with
                # real per-image captions before a full run -- a vague prompt
                # lets the base model's prior dominate the structure signal.

# =============================================================================
# 4. OPERATIONAL SETTINGS
# =============================================================================
seed: 42
val_batches: 4  # val/loss only (a loss pass, no sampling) -- monitoring images
                # are controlled separately by n_grid_images/val_num_inference_steps
                # (train.yaml), generated every ckpt_steps into each checkpoint's
                # own folder, not a shared val_grids/ directory.

# =============================================================================
# 5. PRECISION
# =============================================================================
# bf16 is always on -- hardcoded as mixed_precision="bf16" on the Accelerator
# in segformer_training.py, not a config knob.
ignore_check: true                 # silences the checkpoint-key completeness assert in add_lora_from_config
tag: seg                           # DIFF: outputs/train/seg/...

# =============================================================================
# 6. MODEL OVERRIDES
# =============================================================================
model:
  _target_: src.model.SDXL
  pipeline_type: diffusers.StableDiffusionXLPipeline
  model_name: ${base_model_name}   # segformer_training.py overrides to base_model_path when local
  local_files_only: ${local_files_only}
  guidance_scale: 7.5
  vae_path: madebyollin/sdxl-vae-fp16-fix   # overridden to vae_local_path when local, see src/model.py ModelBase.__init__

# =============================================================================
# 7. LORA ARCHITECTURE  (identical to the Grounded-SAM config)
# =============================================================================
lora:
  struct:
    optimize: true
    cfg: false                     # classifier-free-guidance dropout on the structure conditioning
                                   # is OFF (src/model.py gates self.c_dropout's random structure-
                                   # masking on this). Consider `true` for a real training run: it
                                   # forces the model to sometimes train with zero structure signal,
                                   # the standard ControlNet/T2I-Adapter technique for making
                                   # conditioning genuinely load-bearing instead of easy to ignore.
    ckpt_path: null                # set to resume, e.g. "outputs/train/seg/runs/.../checkpoint-3000"
    encoder:                       # DIFF: identity slot filler (no `model` key) -- skip_encode=True
      _target_: torch.nn.Identity  #       means no encoder is ever called at train time
    config:
      adaption_mode: only_res_conv
      rank: 128
      c_dim: 128
      lora_cls: NewStructLoRAConv
      lora_scale: 1

# LAUNCH:
#   Single GPU : python segformer_training.py experiment=train_seg
#   Multi-GPU  : accelerate launch --num_processes=N segformer_training.py experiment=train_seg
#                (effective batch = data.batch_size x gradient_accumulation_steps x N)
